name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::400294418943:role/GitHubActions-Portfolio-Deploy
          aws-region: us-east-1

      - name: Deploy HTML and root files to S3
        run: |
          aws s3 sync client/dist/ s3://peejaydavid.dev \
            --delete \
            --exclude "index.html" \
            --exclude "assets/*" \
            --exclude "images/*" \
            --exclude "favicon.png" \
            --cache-control "public,max-age=0,must-revalidate"

          aws s3 cp client/dist/index.html s3://peejaydavid.dev/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public,max-age=0,must-revalidate"

          aws s3 cp client/dist/favicon.png s3://peejaydavid.dev/favicon.png \
            --content-type "image/png" \
            --cache-control "public,max-age=86400"

      - name: Deploy immutable assets to S3
        run: |
          aws s3 sync client/dist/assets/ s3://peejaydavid.dev/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 sync client/dist/images/ s3://peejaydavid.dev/images/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E59MLXQVFR5F1 \
            --paths "/*"
